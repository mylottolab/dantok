<script>
(function(){
var $ = DT.$, esc = DT.esc;
var ROOM = new URLSearchParams(location.search).get('r');
if (!ROOM) { location.replace('./'); return; }
var R = null, ME = null, MSGS = [], FIRST = null, LAST = 0, READS = [], URLS = {}, busy = false, poll = null, CH = null, LIVE = false;
var replyTo = null, editing = null, TTL = null;

/* ---------- 방 정보 ---------- */
async function loadRoom(){
  var r = await DT.rpc('dt_room', { p_room: ROOM });
  if (!r.ok) { $('inner').innerHTML = '<p class="sys">' + esc(DT.errText(r.error)) + '</p><a class="btn" href="./" style="align-self:center">내 방 목록으로</a>'; $('cmp').hidden = true; stopPoll(); return false; }
  R = r.room; ME = R.me;
  document.title = R.name + ' — 단톡방';
  $('rName').textContent = R.name;
  subLine();
  $('notice').hidden = !R.notice; $('noticeT').textContent = R.notice || '';
  var st = '';
  if (!R.live) st = R.status !== 'active' ? '이 방은 운영 규칙 때문에 멈췄어요.' : (R.ends_on && new Date(R.ends_on + 'T23:59:59') < new Date()) ? '끝나는 날이 지나 닫힌 방이에요. 글은 읽을 수만 있어요.' : '⏸ 이용 기간이 끝났어요. ' + (R.owner ? '메뉴(☰)에서 연장해 주세요.' : '방장이 연장하면 다시 쓸 수 있어요.');
  else if (R.owner && R.until && new Date(R.until) - Date.now() < 7 * 864e5) st = '⏳ ' + Math.max(0, Math.ceil((new Date(R.until) - Date.now()) / 864e5)) + '일 뒤 이용 기간이 끝나요. 메뉴(☰)에서 연장하세요.';
  if (!st && R.claim) st = '👑 ' + R.claim.nick + '님이 「방장 맡기」를 신청했어요. ' + (R.owner ? '방장님이 들어오셔서 신청이 곧 취소돼요.' : '방장이 ' + Math.max(1, 7 - Math.floor((Date.now() - new Date(R.claim.at)) / 864e5)) + '일 안에 들어오지 않으면 방장이 바뀌어요.');
  else if (!st && R.can_claim) st = '👑 방장이 ' + R.away_days + '일 넘게 자리를 비웠어요. 메뉴(☰)에서 「방장 맡기」를 할 수 있어요.';
  $('state').hidden = !st; $('state').textContent = st;
  $('txt').disabled = !R.live; $('bPlus').disabled = !R.live; $('bTtl').disabled = !R.live;
  $('txt').placeholder = !R.live ? '지금은 쓸 수 없어요' : TTL ? '⏳ 사라지는 메시지' : '메시지';
  paintYt(); paintMusic();
  return true;
}
var typingT = null;
function subLine(who){
  var s = $('rSub');
  if (who) { s.className = 'typing'; s.textContent = who + '님이 입력 중…'; clearTimeout(typingT); typingT = setTimeout(function(){ subLine(); }, 3000); return; }
  s.className = ''; s.textContent = R ? R.members.length + '명' + (ME && ME.muted ? ' · 🔕 알림 꺼짐' : '') : '';
}
$('notice').onclick = function(){ this.classList.toggle('open'); };

/* ---------- 글 그리기 ---------- */
var LINK = /(https?:\/\/[^\s<]+)/g;
var RISK = /(https?:\/\/|www\.)|(\d{2,6}-\d{2,6}-\d{2,8})|(계좌|입금|송금|이체)/;
function ytId(t){
  if (!t) return null;
  var m = String(t).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:[^ ]*&)?v=|embed\/|shorts\/|live\/))([A-Za-z0-9_-]{11})/);
  if (m) return m[1];
  var l = String(t).match(/youtube\.com\/(?:playlist|watch)\?(?:[^ ]*&)?list=([A-Za-z0-9_-]{10,64})/);
  return l ? 'L:' + l[1] : null;
}
function textHtml(s){ return esc(s).replace(LINK, function(u){ return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'; }); }
function unreadOf(id){ var n = 0; for (var i = 0; i < READS.length; i++) if (READS[i] < id) n++; return n; }
function kindWord(k){ return k === 'photo' ? '📷 사진' : k === 'video' ? '🎬 동영상' : k === 'audio' ? '🎵 음원' : k === 'voice' ? '🎤 음성 메시지' : k === 'file' ? '📎 파일' : ''; }
function quote(q){ if (!q) return ''; return '<span class="q" data-jump="' + q.id + '"><b>' + esc(q.nick || '') + '</b> ' + esc(q.body != null ? q.body : (kindWord(q.kind) || '지워진 글')) + '</span>'; }
function mmss(s){ s = Math.max(0, Math.round(+s || 0)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function src(p){ var u = URLS[p]; return u ? ' src="' + esc(u) + '"' : ''; }
function bubble(g, group){
  if (g.deleted) return '<div class="b del">지워진 글이에요.</div>';
  var q = quote(g.reply);
  if (group) return '<div class="b media" data-id="' + g.id + '"><div class="tiles n' + Math.min(group.length, 4) + '">' + group.slice(0, 9).map(function(x){ return '<img alt="사진" loading="lazy" data-path="' + esc(x.path) + '" data-mid="' + x.id + '"' + src(x.path) + '>'; }).join('') + '</div>' + (group.length > 9 ? '<div style="font-size:12.5px;padding:4px 6px;opacity:.75">사진 ' + group.length + '장 · 눌러서 모두 보기</div>' : '') + '</div>';
  if (g.kind === 'text') return '<div class="b" data-id="' + g.id + '">' + q + textHtml(g.body) + '</div>';
  if (g.kind === 'photo') return '<div class="b media" data-id="' + g.id + '">' + q + '<img alt="사진" loading="lazy" data-path="' + esc(g.path) + '" data-mid="' + g.id + '"' + src(g.path) + ' style="min-width:120px;min-height:90px"></div>';

async function first(keep){

}

  var r = await DT.rpc('dt_msgs', { p_room: ROOM, p_after: MSGS[0].id - 1, p_before: null });
  if (!r.ok) return;
  MSGS = r.msgs; READS = r.reads; LAST = MSGS.length ? MSGS[MSGS.length - 1].id : LAST;

}
async function newer(){
  if (busy || document.hidden) return; busy = true;
  try {
    var r = await DT.rpc('dt_msgs', { p_room: ROOM, p_after: LAST, p_before: null });
    if (r.ok) {
      var changed = JSON.stringify(r.reads) !== JSON.stringify(READS); READS = r.reads;
      var add = r.msgs.filter(function(g){ return g.id > LAST; });
      if (add.length) {

        MSGS = MSGS.concat(add); LAST = MSGS[MSGS.length - 1].id;

        render(); markRead(); if (sys) loadRoom();

  } catch (e) {}

}

function shrink(file){
  return new Promise(function(res){
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(function(b){ res(b || file); }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}

  var blob = file, name = file.name || '음성 메시지', ext = (name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
  if (kind === 'photo') { blob = await shrink(file); ext = 'jpg'; t = 'image/jpeg'; }

  if (blob.size > 104857600) { DT.toast(DT.ERR.too_big); return; }
  if (blob.size > R.quota_bytes - R.used_bytes) { quotaFull(); return; }
  DT.toast(kind === 'video' ? '동영상을 올리는 중이에요… 잠시만요' : '올리는 중이에요…');
  var path = ROOM + '/' + uid() + '.' + ext;

    var r = await DT.rpc('dt_send', { p_room: ROOM, p_kind: kind, p_body: null, p_path: path, p_name: name.slice(0, 120), p_size: blob.size, p_reply: replyTo ? replyTo.id : null, p_ttl: TTL, p_secs: secs || null });

  var stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: true }); } catch (e) { DT.toast('마이크를 쓸 수 있게 허용해 주세요.'); return; }
  var mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg'].find(function(m){ return MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m); }) || '';
  var rec = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined), parts = [], t0 = Date.now();
  REC = { rec: rec, stream: stream, timer: setInterval(function(){ var s = (Date.now() - t0) / 1000; $('recT').textContent = '녹음 중 ' + mmss(s); if (s >= 300) stopRec(true); }, 250) };
  rec.ondataavailable = function(e){ if (e.data && e.data.size) parts.push(e.data); };

    var b = new Blob(parts, { type: rec.mimeType || mime || 'audio/webm' });

  };
  $('recT').textContent = '녹음 중 0:00'; $('rec').hidden = false; $('cin').hidden = true; $('emo').hidden = true;

async function save(g){
  try {
    var r = await DT.sb.storage.from('dantok').createSignedUrl(g.path, 600, { download: g.fname || (g.kind === 'photo' ? '사진.jpg' : '파일') });
    if (r.error || !r.data) throw r.error;
    var a = document.createElement('a'); a.href = r.data.signedUrl; a.target = '_blank'; a.rel = 'noopener'; document.body.appendChild(a); a.click(); a.remove();
  } catch (e) { DT.toast('저장하지 못했어요.'); }
}
function twice(msg, fn){ var armed = false; return async function(){ if (!armed) { armed = true; this.textContent = msg; return; } this.disabled = true; try { await fn.call(this); } catch (e) { DT.toast(DT.errText(e)); } }; }
function report(msgId, target){
  var s = DT.sheet('<h3>🚩 신고하기</h3><p class="hint">운영자가 확인해서 방을 멈추거나 사람을 막을 수 있어요. 신고한 사람은 알려지지 않아요.</p>' +
    ['욕설 · 괴롭힘', '사기 · 돈 요구', '광고 · 도배', '음란 · 불법 촬영물', '기타'].map(function(x, i){ return '<button class="btn g" type="button" data-r="' + i + '">' + x + '</button>'; }).join(''));
  s.el.querySelectorAll('[data-r]').forEach(function(b){ b.onclick = async function(){
    try { var r = await DT.rpc('dt_report', { p_room: ROOM, p_msg: msgId, p_target: target, p_reason: b.textContent }); s.close(); DT.toast(r.ok ? '신고했어요. 고맙습니다.' : DT.errText(r.error)); } catch (e) { DT.toast(DT.errText(e)); }
  }; });

/* 사진 크게 보기 (좌우로 넘기기 · 저장) */
function viewer(mid){
  var photos = visible().filter(function(g){ return g.kind === 'photo' && !g.deleted && g.path; }), i = photos.findIndex(function(g){ return g.id === mid; });
  if (i < 0) return;
  var v = document.createElement('div'); v.className = 'view';
  function show(){ var g = photos[i]; v.innerHTML = '<img alt="사진" src="' + esc(URLS[g.path] || '') + '"><div class="vb"><button type="button" data-a="save">⬇ 저장</button><button type="button" data-a="x" aria-label="닫기">✕</button></div>' + (i > 0 ? '<button class="nav l" type="button" data-a="l">‹</button>' : '') + (i < photos.length - 1 ? '<button class="nav r" type="button" data-a="r">›</button>' : ''); }
  v.onclick = function(e){ var a = e.target.getAttribute('data-a'); if (a === 'l') { i--; show(); } else if (a === 'r') { i++; show(); } else if (a === 'save') save(photos[i]); else v.remove(); };
  var x0 = null; v.addEventListener('touchstart', function(e){ x0 = e.touches[0].clientX; }, { passive: true });
  v.addEventListener('touchend', function(e){ if (x0 == null) return; var dx = e.changedTouches[0].clientX - x0; x0 = null; if (dx > 60 && i > 0) { i--; show(); } else if (dx < -60 && i < photos.length - 1) { i++; show(); } }, { passive: true });
  show(); document.body.appendChild(v);
}

/* 글로 이동 (답장 인용 · 검색 · 즐겨찾기) */
async function jumpTo(id){
  for (var k = 0; k < 20 && !MSGS.some(function(g){ return g.id === id; }); k++) { if (!(await older())) break; }
  var el = $('m' + id) || (function(){ var b = document.querySelector('[data-mid="' + id + '"]'); return b && b.closest('.m'); })();
  if (!el) { DT.toast('사라졌거나 지워진 글이에요.'); return; }
  el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.classList.add('flash'); setTimeout(function(){ el.classList.remove('flash'); }, 1600);
}
function hit(s, q){ var t = esc(s || ''); if (!q) return t; var i = t.toLowerCase().indexOf(esc(q).toLowerCase()); return i < 0 ? t : t.slice(0, i) + '<mark>' + t.slice(i, i + esc(q).length) + '</mark>' + t.slice(i + esc(q).length); }
function resultList(msgs, q){
  if (!msgs.length) return '<p class="hint">없어요.</p>';
  return '<div class="res">' + msgs.map(function(g){ return '<button type="button" data-go="' + g.id + '">' + (g.kind === 'text' ? hit(g.body, q) : kindWord(g.kind) + ' ' + hit(g.fname || '', q)) + '<small>' + esc(g.nick || '') + ' · ' + esc(DT.when(g.t)) + '</small></button>'; }).join('') + '</div>';
}
$('bFind').onclick = function(){
  var s = DT.sheet('<h3>🔍 대화 검색</h3><label>찾을 말 · 별명 · 파일 이름<input id="sq" maxlength="40" enterkeyhint="search"></label><div id="sr"></div>');
  var tm = null;
  $('sq').oninput = function(){ clearTimeout(tm); tm = setTimeout(go, 350); };
  $('sq').onkeydown = function(e){ if (e.key === 'Enter') go(); };
  $('sq').focus();
  async function go(){
    var q = $('sq').value.trim(); if (!q) { $('sr').innerHTML = ''; return; }
    var r = await DT.rpc('dt_search', { p_room: ROOM, p_q: q }); if (!r.ok) return;
    $('sr').innerHTML = resultList(r.msgs, q);
    $('sr').querySelectorAll('[data-go]').forEach(function(b){ b.onclick = function(){ s.close(); jumpTo(+b.getAttribute('data-go')); }; });
  }
};
async function stars(){
  var r = await DT.rpc('dt_stars', { p_room: ROOM }); if (!r.ok) return;
  var s = DT.sheet('<h3>⭐ 즐겨찾기</h3>' + resultList(r.msgs, ''));
  s.el.querySelectorAll('[data-go]').forEach(function(b){ b.onclick = function(){ s.close(); jumpTo(+b.getAttribute('data-go')); }; });
}

/* ---------- 📺 유튜브 같이 보기 ---------- */
var ytHidden = null, ytBig = false;
try { ytHidden = sessionStorage.getItem('dt_yt_hide_' + ROOM); } catch (e) {}
function ytEmbed(v){ return v.indexOf('L:') === 0 ? 'https://www.youtube-nocookie.com/embed/videoseries?list=' + v.slice(2) + '&playsinline=1&rel=0' : 'https://www.youtube-nocookie.com/embed/' + v + '?playsinline=1&rel=0'; }
function ytWatch(v){ return v.indexOf('L:') === 0 ? 'https://www.youtube.com/playlist?list=' + v.slice(2) : 'https://www.youtube.com/watch?v=' + v; }
function paintYt(){
  var y = R && R.yt, box = $('yt');
  if (!y) { box.hidden = true; box.innerHTML = ''; $('ytStrip').hidden = true; return; }
  var key = y.v + '@' + y.at;
  if (ytHidden === key) { box.hidden = true; box.innerHTML = ''; $('ytStrip').hidden = false; return; }
  $('ytStrip').hidden = true; box.hidden = false; box.classList.toggle('big', ytBig);
  if (box.getAttribute('data-k') === key) return;
  box.setAttribute('data-k', key);
  var canClear = R.owner || y.by === R.me_id;
  box.innerHTML = '<div class="yf"><iframe src="' + esc(ytEmbed(y.v)) + '" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen title="유튜브"></iframe></div>' +
    '<div class="yc"><span class="yl">📺 ' + esc(y.nick || '') + '님이 띄운 영상</span><button type="button" data-y="big">⤢ 크게</button><a href="' + esc(ytWatch(y.v)) + '" target="_blank" rel="noopener" style="color:#EEF2F7;font-size:12.5px;font-weight:700">↗ 앱</a><button type="button" data-y="hide">✕ 닫기</button>' + (canClear ? '<button type="button" data-y="clear">⬇ 모두 내리기</button>' : '') + '</div>';
  box.querySelectorAll('[data-y]').forEach(function(b){ b.onclick = async function(){
    var a = b.getAttribute('data-y');
    if (a === 'big') { ytBig = !ytBig; box.classList.toggle('big', ytBig); }
    if (a === 'hide') { ytHidden = key; try { sessionStorage.setItem('dt_yt_hide_' + ROOM, key); } catch (e) {} paintYt(); }
    if (a === 'clear') { var r = await DT.rpc('dt_set_yt', { p_room: ROOM, p_v: null }); if (!r.ok) return DT.toast(DT.errText(r.error)); await loadRoom(); ping('room'); }
  }; });
}
$('ytStrip').onclick = function(){ ytHidden = null; try { sessionStorage.removeItem('dt_yt_hide_' + ROOM); } catch (e) {} $('yt').removeAttribute('data-k'); paintYt(); };
async function shareYt(v){
  var r = await DT.rpc('dt_set_yt', { p_room: ROOM, p_v: v });
  if (!r.ok) return DT.toast(r.error === 'bad_video' ? '유튜브 주소가 아니에요.' : DT.errText(r.error));

/* ---------- 🎵 같이 듣기 (회사가 고른 곡만) ---------- */
var P = $('player'), playing = false;
function paintMusic(){
  var m = R && R.music, bar = $('mu');
  if (!m) { bar.hidden = true; if (playing) { P.pause(); playing = false; } P.removeAttribute('data-k'); return; }
  var key = m.path + '@' + m.at, canStop = R.owner || m.by === R.me_id;
  if (P.getAttribute('data-k') !== key) { P.setAttribute('data-k', key); P.src = DT.songUrl(m.path); P.loop = true; if (playing) syncPlay(); }
  bar.hidden = false;
  bar.innerHTML = '<span class="ml">🎵 ' + esc(m.title || '') + (m.artist ? ' · ' + esc(m.artist) : '') + ' <small style="opacity:.7">(' + esc(m.nick || '') + '님)</small></span>' +
    '<button type="button" id="muP">' + (playing ? '⏸ 나만 끄기' : '▶ 같이 듣기') + '</button>' + (canStop ? '<button type="button" id="muS">⏹ 모두 멈추기</button>' : '');
  $('muP').onclick = function(){ if (playing) { P.pause(); playing = false; paintMusic(); } else syncPlay(); };
  if ($('muS')) $('muS').onclick = async function(){ var r = await DT.rpc('dt_set_music', { p_room: ROOM, p_track: null }); if (!r.ok) return DT.toast(DT.errText(r.error)); await loadRoom(); ping('room'); };
}
function syncPlay(){
  var m = R && R.music; if (!m) return;
  var go = function(){ var d = P.duration || m.secs || 0; if (d > 0) { try { P.currentTime = ((Date.now() - new Date(m.at)) / 1000) % d; } catch (e) {} } };
  if (P.readyState >= 1) go(); else P.addEventListener('loadedmetadata', go, { once: true });
  P.play().then(function(){ playing = true; paintMusic(); }).catch(function(){ DT.toast('▶를 한 번 더 눌러 주세요.'); });
}
async function pickSong(){
  var s = DT.sheet('<h3>🎵 같이 듣기</h3><p class="hint">저작권 걱정 없는, 회사가 고른 곡 중에서 골라요. 방 사람 모두의 화면 위에 함께 걸려요.</p><div class="songs" id="sl"><p class="hint">곡 목록을 불러오는 중…</p></div>');
  var list = [];
  try { list = await DT.songs(); } catch (e) {}
  if (!list.length) { $('sl').innerHTML = '<p class="hint">곡 목록을 불러오지 못했어요.</p>'; return; }
  $('sl').innerHTML = list.map(function(x, i){ return '<button type="button" data-i="' + i + '">🎵 <span><b>' + esc(x.title) + '</b><br><small>' + esc(x.artist || '') + (x.seconds ? ' · ' + mmss(x.seconds) : '') + '</small></span></button>'; }).join('');
  $('sl').querySelectorAll('[data-i]').forEach(function(b){ b.onclick = async function(){
    var x = list[+b.getAttribute('data-i')];
    var r = await DT.rpc('dt_set_music', { p_room: ROOM, p_track: { id: x.id, title: x.title, artist: x.artist, path: x.path, secs: x.seconds || null } });
    s.close(); if (!r.ok) return DT.toast(DT.errText(r.error));
    await loadRoom(); newer(); ping('room'); syncPlay();
  }; });
}

    '<span class="sec">👑 방장</span><p class="hint">방장이 ' + R.away_days + '일 넘게 자리를 비우면 다른 분이 「방장 맡기」를 할 수 있어요. 신청하면 방에 알림이 뜨고, 방장이 7일 안에 들어오지 않으면 신청한 분이 방장이 돼요.' + (R.owner ? '' : ' 방장이 마지막으로 들어온 날: ' + (R.owner_seen ? new Date(R.owner_seen).toLocaleDateString('ko-KR') : '-')) + '</p>' +
    (R.can_claim ? '<button class="btn sun" type="button" id="bClaim">👑 방장 맡기</button>' : '') +
    '<button class="btn g" type="button" id="bKeep">📲 휴대폰 바꿀 때 (내 방 지키기)</button>' +
    '<button class="btn red" type="button" id="bLeave">방 나가기</button>');
  $('meNick').value = ME.nick;
  $('meAv').onclick = function(){ s.close(); avatarSheet(); };
  $('meGal').onclick = function(){ gal(R.me_id); };
  signAll();
  $('iShare').onclick = function(){ DT.share('단톡방 초대', '「' + R.name + '」 단톡방에 초대해요. 전화번호 없이 들어와요. 초대 코드 ' + R.code, link); };
  $('iQr').onclick = function(){ var q = $('qr'); q.hidden = !q.hidden; if (!q.hidden && !q.firstChild) { try { new QRCode(q, { text: link, width: 200, height: 200 }); } catch (e) { q.textContent = link; } } };
  $('iStars').onclick = function(){ s.close(); stars(); };
  if ($('pRoom')) $('pRoom').onclick = function(){ s.close(); DT.planSheet('📅 방 이용 기간 늘리기', '지금 ' + (R.live ? new Date(R.until).toLocaleDateString('ko-KR') + '까지예요. 사면 그 날짜에서 1년이 더해지고, 기본 저장 공간 3GB도 그대로 따라와요.' : '이용 기간이 끝났어요. 사면 오늘부터 1년 동안 다시 써요.'), ['dantok_room_1y'], ROOM, function(){ loadRoom(); newer(); ping('room'); }); };
  if ($('pStore')) $('pStore').onclick = function(){ s.close(); DT.planSheet('💾 방 저장 공간 늘리기', '지금 ' + DT.size(R.used_bytes) + ' / ' + DT.size(R.quota_bytes) + ' 쓰고 있어요. 사면 1년 동안 10GB가 더해져요. 공간만 늘고 방 이용 기간은 늘지 않으니, 기간은 「1년 연장」으로 늘려 주세요. 갤러리는 각자 따로라 이 공간을 쓰지 않아요.', ['dantok_room_10g'], ROOM, function(){ loadRoom(); }); };
  if ($('bClaim')) $('bClaim').onclick = twice('한 번 더 누르면 신청해요 (방에 알림이 떠요)', async function(){ var r = await DT.rpc('dt_claim', { p_room: ROOM }); s.close(); if (!r.ok) return DT.toast(DT.errText(r.error)); DT.toast('방장 맡기를 신청했어요. 7일 뒤에 방장이 돼요.'); await loadRoom(); newer(); ping('room'); });
  $('bKeep').onclick = function(){ s.close(); DT.keepSheet && DT.keepSheet(); };
  if (R.owner) {
    $('oName').value = R.name; $('oNotice').value = R.notice || ''; $('oEnd').value = R.ends_on || ''; $('oAway').value = R.away_days || 60;
    $('oSave').onclick = async function(){ var r = await DT.rpc('dt_owner_set', { p_room: ROOM, p_name: $('oName').value, p_notice: $('oNotice').value, p_ends_on: $('oEnd').value || null }); if (!r.ok) return DT.toast(DT.errText(r.error)); var a = Math.round(+$('oAway').value || 60); if (a !== R.away_days) { var r2 = await DT.rpc('dt_set_away', { p_room: ROOM, p_days: a }); if (!r2.ok) return DT.toast(DT.errText(r2.error)); } s.close(); DT.toast('저장했어요.'); await loadRoom(); newer(); ping('room'); };
    $('oCode').onclick = twice('한 번 더 누르면 옛 코드는 못 써요', async function(){ var r = await DT.rpc('dt_new_code', { p_room: ROOM }); if (!r.ok) return DT.toast(DT.errText(r.error)); s.close(); await loadRoom(); DT.toast('새 초대 코드: ' + r.code); });
  }
  $('meSave').onclick = async function(){ var r = await DT.rpc('dt_set_me', { p_room: ROOM, p_nick: $('meNick').value, p_muted: null }); if (!r.ok) return DT.toast(DT.errText(r.error)); s.close(); DT.toast('별명을 바꿨어요.'); await loadRoom(); reloadShown(); ping('change'); };
  $('meMute').onclick = async function(){ var r = await DT.rpc('dt_set_me', { p_room: ROOM, p_nick: ME.nick, p_muted: !ME.muted }); if (!r.ok) return DT.toast(DT.errText(r.error)); s.close(); await loadRoom(); DT.toast(ME.muted ? '이 방 알림을 껐어요.' : '이 방 알림을 켰어요.'); };
  $('bLeave').onclick = twice(R.owner && R.members.length > 1 ? '한 번 더 누르면 나가요 (방장은 다음 사람에게)' : '한 번 더 누르면 나가요', async function(){ var r = await DT.rpc('dt_leave', { p_room: ROOM }); if (!r.ok) return DT.toast(DT.errText(r.error)); ping('room'); location.replace('./'); });
  s.el.querySelectorAll('[data-act]').forEach(function(b){
    var u = b.getAttribute('data-u'), a = b.getAttribute('data-act'), m = R.members.find(function(x){ return x.uid === u; });
    if (a === 'rep') b.onclick = function(){ s.close(); report(null, u); };
    if (a === 'gal') b.onclick = function(){ gal(u); };
    if (a === 'blk') b.onclick = async function(){ await DT.rpc('dt_block', { p_user: u, p_on: !m.blocked }); s.close(); await loadRoom(); reloadShown(); DT.toast(m.blocked ? '차단을 풀었어요.' : '차단했어요.'); };
    if (a === 'kick') b.onclick = twice('한 번 더', async function(){ var r = await DT.rpc('dt_kick', { p_room: ROOM, p_user: u }); s.close(); DT.toast(r.ok ? m.nick + '님을 내보냈어요.' : DT.errText(r.error)); await loadRoom(); newer(); ping('room'); });
    if (a === 'own') b.onclick = twice('한 번 더', async function(){ var r = await DT.rpc('dt_transfer', { p_room: ROOM, p_user: u }); s.close(); DT.toast(r.ok ? m.nick + '님이 새 방장이에요.' : DT.errText(r.error)); await loadRoom(); newer(); ping('room'); });
  });
}

function gal(u){ if (u) location.href = 'gallery.html?r=' + encodeURIComponent(ROOM) + '&u=' + encodeURIComponent(u); }

/* 웹 결제를 마치고 돌아왔는데 아직 아이디가 없으면 → 아이디 정하기 권하기 */
function keepAsk(){ var a = null; try { a = localStorage.getItem('dt_keep_ask'); localStorage.removeItem('dt_keep_ask'); } catch (e) {} if (a) DT.ready().then(function(u){ if (!u.email) DT.keepSheet(); }); }
function quotaFull(){
  if (true) DT.planSheet('💾 방 저장 공간이 다 찼어요', '지금 ' + DT.size(R.used_bytes) + ' / ' + DT.size(R.quota_bytes) + '. 저장 공간을 늘리면 사진 · 동영상을 계속 올릴 수 있어요. 안 쓰는 큰 동영상을 지워도 공간이 생겨요.', ['dantok_room_10g'], ROOM, function(){ loadRoom(); });

}

/* ---------- 프로필 사진 · 그림 ---------- */
var AV_EMO = '🐶 🐱 🐻 🐼 🐰 🦊 🐯 🦁 🐮 🐷 🐸 🐵 🐧 🐥 🦉 🐳 🌸 🌻 🌷 🍀 🌙 ⭐ ☀️ 🌈 🍎 🍓 ☕ 🎵 ⚽ 🌊 👵 👴 👩 👨 👧 👦'.split(' ');
function avatarSheet(){
  var s = DT.sheet('<h3>🖼 프로필 바꾸기</h3><div class="prof">' + DT.av(ME.nick, ME.color, 64, ME.avatar) + '<p class="hint" style="flex:1">이름 첫 글자 대신 보일 사진이나 그림을 골라요. 사진은 나와 같은 방에 있는 사람만 볼 수 있어요.</p></div>' +
    '<label style="flex-direction:row;align-items:center;gap:8px;font-size:15px;color:var(--ink)"><input type="checkbox" id="avAll" checked style="width:22px;height:22px">내 모든 방에 같이 쓰기</label>' +
    '<div class="row"><button class="btn g" type="button" id="avPhoto">📷 내 사진</button><button class="btn g" type="button" id="avNone">첫 글자로</button></div>' +
    '<span class="sec">그림 고르기</span><div class="emo2">' + AV_EMO.map(function(x){ return '<button type="button">' + x + '</button>'; }).join('') + '</div>' +
    '<input type="file" id="avFile" accept="image/*" hidden>');
  signAll();
  async function set(v){
    var r = await DT.rpc('dt_set_avatar', { p_room: ROOM, p_avatar: v, p_all: $('avAll').checked });
    s.close(); if (!r.ok) return DT.toast(DT.errText(r.error));
    DT.toast('프로필을 바꿨어요.'); await loadRoom(); reloadShown(); ping('change');
  }
  s.el.querySelectorAll('.emo2 button').forEach(function(b){ b.onclick = function(){ set('e:' + b.textContent); }; });
  $('avNone').onclick = function(){ set(null); };
  $('avPhoto').onclick = function(){ $('avFile').click(); };
  $('avFile').onchange = async function(){
    var f = this.files[0]; if (!f) return;
    DT.toast('사진을 올리는 중이에요…');
    try {
      var blob = await square(f, 320), path = 'av/' + R.me_id + '/' + Date.now().toString(36) + '.jpg';
      var up = await DT.sb.storage.from('dantok').upload(path, blob, { contentType: 'image/jpeg', upsert: false });
      if (up.error) throw up.error;
      await set('p:' + path);
    } catch (e) { DT.toast(DT.errText(e)); }
  };
}
/* 가운데를 정사각형으로 잘라 작게 */
function square(file, n){
  return new Promise(function(res, rej){
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(img.width, img.height), c = document.createElement('canvas'); c.width = c.height = n;
      c.getContext('2d').drawImage(img, (img.width - k) / 2, (img.height - k) / 2, k, k, 0, 0, n, n); URL.revokeObjectURL(u);
      c.toBlob(function(b){ b ? res(b) : rej('path'); }, 'image/jpeg', 0.86);
    };
    img.onerror = function(){ URL.revokeObjectURL(u); rej('path'); };
    img.src = u;
  });
}

/* ---------- 시작 ---------- */
(async function(){
  try { if (await loadRoom()) { await first(); listen(); startPoll(); keepAsk(); } }
  catch (e) { $('inner').innerHTML = '<p class="sys">' + esc(DT.errText(e)) + '</p>'; }
})();
})();
</script>
</body>
</html>
