<title>단톡방</title>
<meta name="theme-color" content="#1D3B5C">
<!-- 💬 단톡방 대화 화면 (room.html?r=방번호). 글 · 사진 · 동영상 · 음원 · 파일, 공지, 초대, 사람 목록, 방장 기능, 신고 · 차단.
     새 글은 화면을 보고 있는 동안 4초마다 가져옵니다. 2026-11-17 1단계 문자방. -->

<style>
html,body{ height:100%; }
body{ display:flex; flex-direction:column; height:100dvh; overflow:hidden; }
.hd{ flex:none; background:var(--navy); color:#fff; padding:calc(env(safe-area-inset-top, 0px) + 8px) max(10px, env(safe-area-inset-right)) 8px max(10px, env(safe-area-inset-left)); display:flex; align-items:center; gap:8px; }
.hd a.back, .hd button{ flex:none; width:40px; height:40px; border-radius:50%; border:none; background:rgba(255,255,255,.12); color:#fff; font-size:20px; display:inline-flex; align-items:center; justify-content:center; text-decoration:none; cursor:pointer; padding:0; }
.hd .tt{ flex:1; min-width:0; }
.hd .tt b{ display:block; font-size:17.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hd .tt small{ opacity:.8; font-size:13px; }
.notice{ flex:none; background:var(--warnbg); color:var(--warn); padding:8px max(14px, env(safe-area-inset-right)) 8px max(14px, env(safe-area-inset-left)); font-size:14.5px; font-weight:700; display:flex; gap:8px; cursor:pointer; }
.notice span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.notice.open span{ white-space:normal; }
.state{ flex:none; background:var(--tint); color:var(--ink); text-align:center; padding:8px 14px; font-size:14px; font-weight:700; }
#list{ flex:1; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:10px max(10px, env(safe-area-inset-right)) 14px max(10px, env(safe-area-inset-left)); display:flex; flex-direction:column; gap:6px; }
.inner{ max-width:720px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:6px; }
.more{ align-self:center; border:1.5px solid var(--line); background:var(--card); color:var(--sub); border-radius:20px; padding:6px 14px; font:inherit; font-size:14px; font-weight:700; cursor:pointer; }
.day{ align-self:center; background:var(--tint); color:var(--sub); font-size:13px; font-weight:700; border-radius:20px; padding:3px 12px; margin:8px 0 2px; }
.sys{ align-self:center; color:var(--sub); font-size:13.5px; text-align:center; max-width:90%; }
.m{ display:flex; gap:8px; align-items:flex-start; max-width:100%; }
.m .av{ width:38px; height:38px; font-size:15px; }
.m .col{ display:flex; flex-direction:column; gap:3px; min-width:0; max-width:78%; }
.m .who{ font-size:13.5px; font-weight:700; color:var(--sub); }
.m .ln{ display:flex; align-items:flex-end; gap:5px; min-width:0; }
.b{ background:var(--their); border:1px solid var(--line); border-radius:4px 16px 16px 16px; padding:9px 12px; white-space:pre-wrap; overflow-wrap:anywhere; min-width:0; cursor:pointer; font-size:16.5px; }
.b.del{ color:var(--sub); font-style:italic; }
.b.media{ padding:4px; background:var(--their); }
.b.media{ max-width:100%; }
.b.media img, .b.media video{ display:block; width:min(230px, 56vw); max-width:100%; height:auto; max-height:340px; object-fit:cover; border-radius:12px; }
.b.media audio{ width:min(260px, 62vw); }
.b .file{ display:flex; gap:8px; align-items:center; padding:6px 8px; color:var(--ink); text-decoration:none; font-weight:700; }
.meta{ display:flex; flex-direction:column; align-items:flex-end; font-size:11.5px; color:var(--sub); flex:none; line-height:1.3; }
.meta .u{ color:var(--sun); font-weight:900; }

.m.mine .col{ align-items:flex-end; }
.m.mine .ln{ flex-direction:row-reverse; }
.m.mine .meta{ align-items:flex-start; }
.m.mine .b{ background:var(--mine); color:var(--mineInk); border-color:transparent; border-radius:16px 4px 16px 16px; }
.m.mine .b.media{ background:var(--mine); }
.m.cont .av{ visibility:hidden; height:0; }
.m.cont .who{ display:none; }
.warn{ font-size:12.5px; color:var(--warn); background:var(--warnbg); border-radius:8px; padding:3px 8px; }
.cmp{ flex:none; background:var(--card); border-top:1.5px solid var(--line); padding:8px max(10px, env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom, 0px)) max(10px, env(safe-area-inset-left)); }
.cmp .in{ max-width:720px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
.cmp textarea{ flex:1; min-height:46px; max-height:140px; resize:none; border-radius:22px; padding:11px 14px; line-height:1.45; }
.cmp .plus, .cmp .send{ flex:none; width:46px; height:46px; border-radius:50%; border:none; font-size:22px; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
.cmp .plus{ background:var(--tint); color:var(--ink); }
.cmp .send{ background:var(--navy); color:#fff; font-size:19px; }
.cmp .send:disabled{ opacity:.45; }
.bar{ height:10px; border-radius:6px; background:var(--tint); overflow:hidden; } .bar i{ display:block; height:100%; background:var(--sky); }
.sec{ font-size:13.5px; font-weight:800; color:var(--sub); margin-top:4px; }
.codebig{ font-size:30px; letter-spacing:6px; font-weight:900; text-align:center; background:var(--tint); border-radius:14px; padding:10px; }
#qr{ align-self:center; background:#fff; padding:12px; border-radius:14px; }
.view{ position:fixed; inset:0; background:rgba(0,0,0,.92); z-index:80; display:flex; align-items:center; justify-content:center; padding:env(safe-area-inset-top, 0px) 0 env(safe-area-inset-bottom, 0px); }
.view img{ max-width:100%; max-height:100%; }
.view button{ position:absolute; top:calc(env(safe-area-inset-top, 0px) + 10px); right:calc(env(safe-area-inset-right, 0px) + 10px); width:44px; height:44px; border-radius:50%; border:none; background:rgba(255,255,255,.15); color:#fff; font-size:22px; }
</style>
</head>
<body>
<header class="hd">
  <a class="back" href="./" aria-label="내 방 목록">‹</a>
  <div class="tt"><b id="rName">단톡방</b><small id="rSub"></small></div>
  <button type="button" id="bMenu" aria-label="방 메뉴">☰</button>
</header>
<div class="notice" id="notice" hidden><b>📢</b><span id="noticeT"></span></div>
<div class="state" id="state" hidden></div>
<main id="list"><div class="inner" id="inner"><p class="sys">불러오는 중…</p></div></main>
<div class="cmp" id="cmp">
  <div class="in">
    <button class="plus" type="button" id="bPlus" aria-label="사진 · 파일 보내기">＋</button>
    <textarea id="txt" rows="1" maxlength="2000" placeholder="글을 적어 주세요"></textarea>
    <button class="send" type="button" id="bSend" aria-label="보내기" disabled>➤</button>
  </div>
</div>
<input type="file" id="fMedia" accept="image/*,video/*" hidden>
<input type="file" id="fAny" hidden>
<div class="toast" id="toast" role="status"></div>
<script>
(function(){
var $ = DT.$, esc = DT.esc;
var ROOM = new URLSearchParams(location.search).get('r');
if (!ROOM) { location.replace('./'); return; }
var R = null, ME = null, MSGS = [], FIRST = null, LAST = 0, READS = [], URLS = {}, busy = false, poll = null;

/* ---------- 방 정보 ---------- */
async function loadRoom(){
  var r = await DT.rpc('dt_room', { p_room: ROOM });
  if (!r.ok) { $('inner').innerHTML = '<p class="sys">' + esc(DT.errText(r.error)) + '</p><a class="btn" href="./" style="align-self:center">내 방 목록으로</a>'; $('cmp').hidden = true; stopPoll(); return false; }
  R = r.room; ME = R.me;
  document.title = R.name + ' — 단톡방';
  $('rName').textContent = R.name;
  $('rSub').textContent = R.members.length + '명' + (ME && ME.muted ? ' · 🔕 알림 꺼짐' : '');
  $('notice').hidden = !R.notice; $('noticeT').textContent = R.notice || '';
  var st = '';
  if (!R.live) st = R.status !== 'active' ? '이 방은 운영 규칙 때문에 멈췄어요.' : (R.ends_on && new Date(R.ends_on + 'T23:59:59') < new Date()) ? '끝나는 날이 지나 닫힌 방이에요. 글은 읽을 수만 있어요.' : '⏸ 이용 기간이 끝났어요. ' + (R.owner ? '메뉴(☰)에서 연장해 주세요.' : '방장이 연장하면 다시 쓸 수 있어요.');
  else if (!R.owner && R.until && new Date(R.until) - Date.now() < 7 * 864e5) st = '';
  else if (R.owner && R.until && new Date(R.until) - Date.now() < 7 * 864e5) st = '⏳ ' + Math.max(0, Math.ceil((new Date(R.until) - Date.now()) / 864e5)) + '일 뒤 이용 기간이 끝나요. 메뉴(☰)에서 연장하세요.';
  $('state').hidden = !st; $('state').textContent = st;
  $('txt').disabled = !R.live; $('bPlus').disabled = !R.live;
  $('txt').placeholder = R.live ? '글을 적어 주세요' : '지금은 글을 쓸 수 없어요';
  return true;
}
$('notice').onclick = function(){ this.classList.toggle('open'); };

/* ---------- 글 그리기 ---------- */
var LINK = /(https?:\/\/[^\s<]+)/g;
var RISK = /(https?:\/\/|www\.)|(\d{2,6}-\d{2,6}-\d{2,8})|(계좌|입금|송금|이체)/;
function textHtml(s){ return esc(s).replace(LINK, function(u){ return '<a href="' + u + '" target="_blank" rel="noopener noreferrer">' + u + '</a>'; }); }
function unreadOf(id){ var n = 0; for (var i = 0; i < READS.length; i++) if (READS[i] < id) n++; return n; }
function bubble(g){
  if (g.deleted) return '<div class="b del">지워진 글이에요.</div>';
  if (g.kind === 'text') return '<div class="b" data-id="' + g.id + '">' + textHtml(g.body) + '</div>';
  var u = URLS[g.path] || '';
  if (g.kind === 'photo') return '<div class="b media" data-id="' + g.id + '"><img alt="사진" loading="lazy" data-path="' + esc(g.path) + '"' + (u ? ' src="' + esc(u) + '"' : '') + ' style="min-width:120px;min-height:90px;background:var(--tint)"></div>';
  if (g.kind === 'video') return '<div class="b media" data-id="' + g.id + '"><video controls playsinline preload="metadata" data-path="' + esc(g.path) + '"' + (u ? ' src="' + esc(u) + '"' : '') + '></video></div>';
  if (g.kind === 'audio') return '<div class="b media" data-id="' + g.id + '"><div style="padding:4px 6px 2px;font-size:13.5px;font-weight:700">🎵 ' + esc(g.fname || '음원') + '</div><audio controls preload="none" data-path="' + esc(g.path) + '"' + (u ? ' src="' + esc(u) + '"' : '') + '></audio></div>';
  return '<div class="b media" data-id="' + g.id + '"><a class="file" data-path="' + esc(g.path) + '"' + (u ? ' href="' + esc(u) + '"' : '') + ' target="_blank" rel="noopener">📎 <span>' + esc(g.fname || '파일') + '<br><small style="color:var(--sub);font-weight:600">' + DT.size(g.size) + '</small></span></a></div>';
}
function render(keepBottom){
  var L = $('list'), atBottom = L.scrollHeight - L.scrollTop - L.clientHeight < 120, oldH = L.scrollHeight, oldTop = L.scrollTop;
  var h = [], prevDay = '', prev = null;
  if (FIRST !== null && MSGS.length >= 50 && MSGS[0] && MSGS[0].id > 1) h.push('<button class="more" type="button" id="bMore">이전 글 더 보기</button>');
  MSGS.forEach(function(g){
    var d = new Date(g.t).toDateString();
    if (d !== prevDay) { h.push('<div class="day">' + esc(DT.day(g.t)) + '</div>'); prevDay = d; prev = null; }
    if (g.kind === 'system') { h.push('<div class="sys">' + esc(g.body) + '</div>'); prev = null; return; }
    var cont = prev && prev.uid === g.uid && (new Date(g.t) - new Date(prev.t)) < 3 * 60000;
    var un = unreadOf(g.id), risky = !g.mine && !g.deleted && g.kind === 'text' && RISK.test(g.body || '');
    h.push('<div class="m' + (g.mine ? ' mine' : '') + (cont ? ' cont' : '') + '">' + (g.mine ? '' : DT.av(g.nick, g.color)) +
      '<div class="col">' + (g.mine ? '' : '<span class="who">' + esc(g.nick || '나간 사람') + '</span>') +
      '<div class="ln">' + bubble(g) + '<span class="meta">' + (un > 0 ? '<span class="u">' + un + '</span>' : '') + '<span>' + esc(DT.hm(g.t)) + '</span></span></div>' +
      (risky ? '<span class="warn">⚠ 링크 · 계좌번호는 한 번 더 확인하세요. 돈 이야기는 직접 통화로 확인하세요.</span>' : '') + '</div></div>');
    prev = g;
  });
  if (!MSGS.length) h.push('<p class="sys">아직 글이 없어요. 첫 인사를 남겨 보세요!</p>');
  $('inner').innerHTML = h.join('');
  if (keepBottom === 'top') L.scrollTop = L.scrollHeight - oldH + oldTop;
  else if (keepBottom || atBottom) L.scrollTop = L.scrollHeight;
  var m = $('bMore'); if (m) m.onclick = older;
  signAll();
}
async function signAll(){
  var need = [];
  document.querySelectorAll('[data-path]').forEach(function(el){ var p = el.getAttribute('data-path'); if (p && !URLS[p] && need.indexOf(p) < 0) need.push(p); });
  if (!need.length) return;
  try {
    var r = await DT.sb.storage.from('dantok').createSignedUrls(need, 3600);
    (r.data || []).forEach(function(x){ if (x.signedUrl) URLS[x.path] = x.signedUrl; });
  } catch (e) {}
  document.querySelectorAll('[data-path]').forEach(function(el){
    var u = URLS[el.getAttribute('data-path')]; if (!u) return;
    if (el.tagName === 'A') { if (!el.getAttribute('href')) el.href = u; } else if (!el.getAttribute('src')) el.src = u;
  });
}

/* ---------- 글 가져오기 ---------- */
async function first(){
  var r = await DT.rpc('dt_msgs', { p_room: ROOM, p_after: null, p_before: null });
  if (!r.ok) return;
  MSGS = r.msgs; READS = r.reads; FIRST = MSGS.length ? MSGS[0].id : 0; LAST = MSGS.length ? MSGS[MSGS.length - 1].id : 0;
  render(true); markRead();
}
async function newer(){
  if (busy || document.hidden) return; busy = true;
  try {
    var r = await DT.rpc('dt_msgs', { p_room: ROOM, p_after: LAST, p_before: null });
    if (r.ok) {
      var changed = JSON.stringify(r.reads) !== JSON.stringify(READS); READS = r.reads;
      if (r.msgs.length) {
        var sys = r.msgs.some(function(g){ return g.kind === 'system'; });
        MSGS = MSGS.concat(r.msgs.filter(function(g){ return g.id > LAST; })); LAST = MSGS[MSGS.length - 1].id;
        render(); markRead(); if (sys) loadRoom();
      } else if (changed) render();
    } else if (r.error === 'not_member') { await loadRoom(); }
  } catch (e) {}
  busy = false;
}
async function older(){
  if (!MSGS.length) return;
  var r = await DT.rpc('dt_msgs', { p_room: ROOM, p_after: null, p_before: MSGS[0].id });
  if (!r.ok) return;
  MSGS = r.msgs.concat(MSGS); if (!r.msgs.length) FIRST = null;
  render('top');
}
function markRead(){ if (!document.hidden && LAST) DT.rpc('dt_read', { p_room: ROOM, p_last: LAST }).catch(function(){}); }
function startPoll(){ stopPoll(); poll = setInterval(newer, 4000); }
function stopPoll(){ if (poll) clearInterval(poll); poll = null; }
document.addEventListener('visibilitychange', function(){ if (!document.hidden) { newer(); startPoll(); } else stopPoll(); });

/* ---------- 보내기 ---------- */
var T = $('txt');
function grow(){ T.style.height = 'auto'; T.style.height = Math.min(140, T.scrollHeight + 2) + 'px'; $('bSend').disabled = !T.value.trim(); }
T.addEventListener('input', grow);
T.addEventListener('keydown', function(e){ if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && window.matchMedia('(pointer:fine)').matches) { e.preventDefault(); send(); } });
$('bSend').onclick = send;
async function send(){
  var v = T.value.trim(); if (!v) return;
  $('bSend').disabled = true;
  try {
    var r = await DT.rpc('dt_send', { p_room: ROOM, p_kind: 'text', p_body: v, p_path: null, p_name: null, p_size: null });
    if (!r.ok) throw r.error;
    T.value = ''; grow(); await newer(); $('list').scrollTop = $('list').scrollHeight; notify(r.id);
  } catch (e) { DT.toast(DT.errText(e)); $('bSend').disabled = false; }
}
function notify(id){
  /* 알림은 단톡방 앱 서버 함수(dantok-notify)가 보냅니다. 함수가 아직 없으면 조용히 넘어갑니다. */
  DT.sb.functions.invoke('dantok-notify', { body: { msg: id } }).catch(function(){});
}

$('bPlus').onclick = function(){
  var s = DT.sheet('<h3>보내기</h3>' +
    '<button class="btn g" type="button" id="pMedia">🖼 사진 · 동영상</button>' +
    '<button class="btn g" type="button" id="pAny">📎 음원 · 파일</button>' +
    '<p class="hint">한 번에 100MB까지 보낼 수 있어요. 사진은 보기 좋은 크기로 줄여서 보냅니다.</p>');
  $('pMedia').onclick = function(){ s.close(); $('fMedia').click(); };
  $('pAny').onclick = function(){ s.close(); $('fAny').click(); };
};
$('fMedia').onchange = function(){ var f = this.files[0]; this.value = ''; if (f) upload(f); };
$('fAny').onchange = function(){ var f = this.files[0]; this.value = ''; if (f) upload(f); };

function shrink(file){
  return new Promise(function(res){
    var img = new Image(), u = URL.createObjectURL(file);
    img.onload = function(){
      var k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u);
      c.toBlob(function(b){ res(b || file); }, 'image/jpeg', 0.85);
    };
    img.onerror = function(){ URL.revokeObjectURL(u); res(file); };
    img.src = u;
  });
}
function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2)); }
async function upload(file){
  var t = file.type || '', kind = /^image\//.test(t) && !/gif|svg/.test(t) ? 'photo' : /^video\//.test(t) ? 'video' : /^audio\//.test(t) ? 'audio' : 'file';
  var blob = file, ext = (file.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 5) || 'bin';
  if (kind === 'photo') { blob = await shrink(file); ext = 'jpg'; t = 'image/jpeg'; }
  if (blob.size > 104857600) { DT.toast(DT.ERR.too_big); return; }
  var left = R.quota_bytes - R.used_bytes; if (blob.size > left) { DT.toast(DT.ERR.quota); return; }
  DT.toast(kind === 'video' ? '동영상을 올리는 중이에요… 잠시만요' : '올리는 중이에요…');
  var path = ROOM + '/' + uid() + '.' + ext;
  try {
    var up = await DT.sb.storage.from('dantok').upload(path, blob, { contentType: t || 'application/octet-stream', upsert: false });
    if (up.error) throw up.error;
    var r = await DT.rpc('dt_send', { p_room: ROOM, p_kind: kind, p_body: null, p_path: path, p_name: file.name.slice(0, 120), p_size: blob.size });
    if (!r.ok) throw r.error;
    R.used_bytes += blob.size; await newer(); $('list').scrollTop = $('list').scrollHeight; notify(r.id);
  } catch (e) { DT.toast(DT.errText(e)); }
}

/* ---------- 글 누르기: 크게 보기 · 복사 · 지우기 · 신고 · 차단 ---------- */
$('inner').addEventListener('click', function(e){
  if (e.target.closest('a, video, audio')) return;
  var img = e.target.closest('img[data-path]');
  if (img && img.src) { var v = document.createElement('div'); v.className = 'view'; v.innerHTML = '<img alt="사진" src="' + esc(img.src) + '"><button type="button" aria-label="닫기">✕</button>'; v.onclick = function(){ v.remove(); }; document.body.appendChild(v); return; }
  var b = e.target.closest('.b[data-id]'); if (!b) return;
  var g = MSGS.find(function(x){ return String(x.id) === b.getAttribute('data-id'); }); if (!g || g.deleted) return;
  msgMenu(g);
});
function msgMenu(g){
  var canDel = g.mine || (R && R.owner);
  var s = DT.sheet('<h3>' + (g.mine ? '내 글' : esc(g.nick || '') + '님의 글') + '</h3>' +
    (g.kind === 'text' ? '<button class="btn g" type="button" id="mCopy">📋 복사</button>' : '') +
    (canDel ? '<button class="btn g" type="button" id="mDel">🗑 지우기</button>' : '') +
    (!g.mine ? '<button class="btn g" type="button" id="mRep">🚩 이 글 신고</button><button class="btn red" type="button" id="mBlk">🚫 ' + esc(g.nick || '') + '님 차단</button>' : ''));
  if ($('mCopy')) $('mCopy').onclick = function(){ DT.copy(g.body); s.close(); };
  if ($('mDel')) $('mDel').onclick = twice('한 번 더 누르면 지워요', async function(){
    var r = await DT.rpc('dt_delete_msg', { p_room: ROOM, p_id: g.id }); s.close();
    if (!r.ok) return DT.toast(DT.errText(r.error));
    g.deleted = true; render(); DT.toast('지웠어요.');
  });
  if ($('mRep')) $('mRep').onclick = function(){ s.close(); report(g.id, g.uid); };
  if ($('mBlk')) $('mBlk').onclick = twice('한 번 더 누르면 차단해요', async function(){ await DT.rpc('dt_block', { p_user: g.uid, p_on: true }); s.close(); DT.toast('차단했어요. 이제 이 사람의 글이 보이지 않아요.'); first(); loadRoom(); });
}
function twice(msg, fn){ var armed = false; return async function(){ if (!armed) { armed = true; this.dataset.t = this.textContent; this.textContent = msg; return; } this.disabled = true; try { await fn.call(this); } catch (e) { DT.toast(DT.errText(e)); } }; }
function report(msgId, target){
  var s = DT.sheet('<h3>🚩 신고하기</h3><p class="hint">운영자가 확인해서 방을 멈추거나 사람을 막을 수 있어요. 신고한 사람은 알려지지 않아요.</p>' +
    ['욕설 · 괴롭힘', '사기 · 돈 요구', '광고 · 도배', '음란 · 불법 촬영물', '기타'].map(function(x, i){ return '<button class="btn g" type="button" data-r="' + i + '">' + x + '</button>'; }).join(''));
  s.el.querySelectorAll('[data-r]').forEach(function(b){ b.onclick = async function(){
    try { var r = await DT.rpc('dt_report', { p_room: ROOM, p_msg: msgId, p_target: target, p_reason: b.textContent }); s.close(); DT.toast(r.ok ? '신고했어요. 고맙습니다.' : DT.errText(r.error)); } catch (e) { DT.toast(DT.errText(e)); }
  }; });
}

/* ---------- 방 메뉴 ---------- */
$('bMenu').onclick = function(){ if (R) menu(); };
function menu(){
  var link = DT.SITE + '?j=' + R.code, pct = Math.min(100, Math.round(R.used_bytes / R.quota_bytes * 100));
  var mem = R.members.map(function(m){
    return '<div class="item">' + DT.av(m.nick, m.color, 34) + '<span class="nm">' + esc(m.nick) + (m.role === 'owner' ? ' 👑' : '') + (m.me ? ' <small style="color:var(--sub)">(나)</small>' : '') + '</span>' +
      (m.me ? '' : '<button class="mini" type="button" data-act="blk" data-u="' + m.uid + '">' + (m.blocked ? '차단 풀기' : '차단') + '</button>' +
        (R.owner ? '<button class="mini" type="button" data-act="own" data-u="' + m.uid + '">방장 넘기기</button><button class="mini red" type="button" data-act="kick" data-u="' + m.uid + '">내보내기</button>' : '<button class="mini" type="button" data-act="rep" data-u="' + m.uid + '">신고</button>')) + '</div>';
  }).join('');
  var s = DT.sheet('<h3>' + esc(R.name) + '</h3>' +
    '<span class="sec">초대하기</span><div class="codebig">' + esc(R.code) + '</div>' +
    '<div class="row"><button class="btn sun" type="button" id="iShare">링크 보내기</button><button class="btn g" type="button" id="iQr">QR 보기</button></div>' +
    '<p class="hint">초대받은 사람은 전화번호 없이 코드나 링크로 들어와요. 공기계도 와이파이만 있으면 돼요.</p><div id="qr" hidden></div>' +
    (R.owner ? '<span class="sec">방장 설정</span>' +
      '<label>방 이름<input id="oName" maxlength="30"></label><label>공지 (위에 늘 보여요)<textarea id="oNotice" maxlength="200" rows="2" placeholder="예) 이번 모임은 토요일 6시 · 회비 2만 원"></textarea></label>' +
      '<label>끝나는 날 (선택)<input id="oEnd" type="date"></label>' +
      '<div class="row"><button class="btn" type="button" id="oSave">저장</button><button class="btn g" type="button" id="oCode">초대 코드 새로</button></div>' : '') +
    '<span class="sec">사람 ' + R.members.length + '명</span><div>' + mem + '</div>' +
    '<span class="sec">나</span><label>이 방에서 쓰는 내 별명<input id="meNick" maxlength="16"></label>' +
    '<div class="row"><button class="btn g" type="button" id="meSave">별명 저장</button><button class="btn g" type="button" id="meMute">' + (ME.muted ? '🔔 알림 켜기' : '🔕 알림 끄기') + '</button></div>' +
    '<span class="sec">저장 공간 · 이용 기간</span><div class="bar"><i style="width:' + pct + '%"></i></div>' +
    '<p class="hint">' + DT.size(R.used_bytes) + ' / ' + DT.size(R.quota_bytes) + ' 사용 · ' + (R.live ? new Date(R.until).toLocaleDateString('ko-KR') + '까지' : '이용 기간이 끝났어요') + (R.ends_on ? ' · 끝나는 날 ' + esc(R.ends_on) : '') + '</p>' +
    (R.owner ? '<p class="hint">연장 · 저장권은 곧 이 자리에서 살 수 있어요.</p>' : '') +
    '<button class="btn red" type="button" id="bLeave">방 나가기</button>');
  $('meNick').value = ME.nick;
  $('iShare').onclick = function(){ DT.share('단톡방 초대', '「' + R.name + '」 단톡방에 초대해요. 전화번호 없이 들어와요. 초대 코드 ' + R.code, link); };
  $('iQr').onclick = function(){ var q = $('qr'); q.hidden = !q.hidden; if (!q.hidden && !q.firstChild) { try { new QRCode(q, { text: link, width: 200, height: 200 }); } catch (e) { q.textContent = link; } } };
  if (R.owner) {
    $('oName').value = R.name; $('oNotice').value = R.notice || ''; $('oEnd').value = R.ends_on || '';
    $('oSave').onclick = async function(){ var r = await DT.rpc('dt_owner_set', { p_room: ROOM, p_name: $('oName').value, p_notice: $('oNotice').value, p_ends_on: $('oEnd').value || null }); if (!r.ok) return DT.toast(DT.errText(r.error)); s.close(); DT.toast('저장했어요.'); await loadRoom(); newer(); };
    $('oCode').onclick = twice('한 번 더 누르면 옛 코드는 못 써요', async function(){ var r = await DT.rpc('dt_new_code', { p_room: ROOM }); if (!r.ok) return DT.toast(DT.errText(r.error)); s.close(); await loadRoom(); DT.toast('새 초대 코드: ' + r.code); });
  }
  $('meSave').onclick = async function(){ var r = await DT.rpc('dt_set_me', { p_room: ROOM, p_nick: $('meNick').value, p_muted: null }); if (!r.ok) return DT.toast(DT.errText(r.error)); s.close(); DT.toast('별명을 바꿨어요.'); await loadRoom(); first(); };
  $('meMute').onclick = async function(){ var r = await DT.rpc('dt_set_me', { p_room: ROOM, p_nick: ME.nick, p_muted: !ME.muted }); if (!r.ok) return DT.toast(DT.errText(r.error)); s.close(); await loadRoom(); DT.toast(ME.muted ? '이 방 알림을 껐어요.' : '이 방 알림을 켰어요.'); };
  $('bLeave').onclick = twice(R.owner && R.members.length > 1 ? '한 번 더 누르면 나가요 (방장은 다음 사람에게)' : '한 번 더 누르면 나가요', async function(){ var r = await DT.rpc('dt_leave', { p_room: ROOM }); if (!r.ok) return DT.toast(DT.errText(r.error)); location.replace('./'); });
  s.el.querySelectorAll('[data-act]').forEach(function(b){
    var u = b.getAttribute('data-u'), a = b.getAttribute('data-act'), m = R.members.find(function(x){ return x.uid === u; });
    if (a === 'rep') b.onclick = function(){ s.close(); report(null, u); };
    if (a === 'blk') b.onclick = async function(){ await DT.rpc('dt_block', { p_user: u, p_on: !m.blocked }); s.close(); await loadRoom(); first(); DT.toast(m.blocked ? '차단을 풀었어요.' : '차단했어요.'); };
    if (a === 'kick') b.onclick = twice('한 번 더', async function(){ var r = await DT.rpc('dt_kick', { p_room: ROOM, p_user: u }); s.close(); DT.toast(r.ok ? m.nick + '님을 내보냈어요.' : DT.errText(r.error)); await loadRoom(); newer(); });
    if (a === 'own') b.onclick = twice('한 번 더', async function(){ var r = await DT.rpc('dt_transfer', { p_room: ROOM, p_user: u }); s.close(); DT.toast(r.ok ? m.nick + '님이 새 방장이에요.' : DT.errText(r.error)); await loadRoom(); newer(); });
  });
}

/* ---------- 시작 ---------- */
(async function(){
  try { if (await loadRoom()) { await first(); startPoll(); } }
  catch (e) { $('inner').innerHTML = '<p class="sys">' + esc(DT.errText(e)) + '</p>'; }
})();
})();
</script>
</body>
</html>
